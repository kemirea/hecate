<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Route Planner</title>

  <!-- Leaflet (map rendering) — vendored locally, see vendor/ -->
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <script src="vendor/leaflet.js"></script>
  <!-- SortableJS (drag-to-reorder the pulls list) — vendored locally -->
  <script src="vendor/sortable.min.js"></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-mode="plan">
  <header id="toolbar">
    <span class="brand">🐈 Route Planner</span>

    <label class="field">
      Map
      <select id="map-select"></select>
    </label>

    <label class="field grow">
      Route
      <select id="saved-select" class="saved-select" title="Load a saved route"><!-- rendered by app.js --></select>
    </label>
    <button id="saved-rename" class="btn" title="Rename selected route">✎</button>
    <button id="saved-delete" class="btn" title="Delete selected route">🗑</button>

    <button id="new-route" class="btn">New route</button>
    <button id="export-route" class="btn" title="Export the current route as a shareable text string">Export</button>
    <button id="import-route" class="btn" title="Import a route from a text string">Import</button>
    <a class="btn" href="map-editor.html" title="Create and edit maps">Map Editor</a>

    <span id="status" class="status"></span>
  </header>

  <main id="layout">
    <aside id="sidebar">
      <div id="plan-panels">
        <div id="sidebar-header">
          <div id="route-total" class="route-total"><!-- rendered by app.js --></div>
        </div>

        <section class="panel" id="pulls-section">
          <div class="panel-head">
            <h2>Pulls</h2>
            <button id="add-pull" class="btn btn-small">+ Add pull</button>
          </div>
          <ol id="pulls-list" class="pulls-list"><!-- rendered by app.js --></ol>
          <p class="hint">
            Select a pull, then click groups on the map to add/remove them.
            Drag <span class="grip">⠿</span> to reorder.
          </p>
        </section>
      </div>
    </aside>

    <div id="map"></div>
  </main>

  <script src="js/monsters.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
